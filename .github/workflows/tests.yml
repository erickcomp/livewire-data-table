name: Tests

on:
  push:
    branches: [master, livewire-4.x]
  pull_request:
    branches: [master, livewire-4.x]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - php: '8.3'
            laravel: '12'
            testbench: '^10.0'
            livewire: '^4.0'
          - php: '8.3'
            laravel: '13'
            testbench: '^11.0'
            livewire: '^4.0'
          - php: '8.4'
            laravel: '12'
            testbench: '^10.0'
            livewire: '^4.0'
          - php: '8.4'
            laravel: '13'
            testbench: '^11.0'
            livewire: '^4.0'
          - php: '8.3'
            laravel: '12'
            testbench: '^10.0'
            livewire: '^3.6'
          - php: '8.4'
            laravel: '13'
            testbench: '^11.0'
            livewire: '^3.6'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Livewire ${{ matrix.livewire }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, sockets, gd, zip, xmlreader, xmlwriter
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-livewire${{ matrix.livewire }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-livewire${{ matrix.livewire }}-

      - name: Install dependencies
        run: |
          composer require "livewire/livewire:${{ matrix.livewire }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --colors=always

      # Production deploys often dump the autoloader this way, which only finds classes by their declared name
      - name: Run tests (classmap-authoritative autoloader)
        run: |
          composer dump-autoload --classmap-authoritative --no-interaction
          vendor/bin/pest --colors=always

  static-analysis:
    runs-on: ubuntu-latest
    name: PHPStan

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, sockets, gd, zip, xmlreader, xmlwriter
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-phpstan-${{ hashFiles('composer.json') }}
          restore-keys: composer-phpstan-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  browser:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        livewire: ['^3.6', '^4.0']

    name: Browser tests / Livewire ${{ matrix.livewire }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, sockets, gd, zip, xmlreader, xmlwriter
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-browser-livewire${{ matrix.livewire }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-browser-livewire${{ matrix.livewire }}-

      - name: Install dependencies
        run: |
          composer require "livewire/livewire:${{ matrix.livewire }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: vendor/bin/pest --testsuite=Browser --colors=always

      - name: Upload screenshots of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots-livewire${{ matrix.livewire }}
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
